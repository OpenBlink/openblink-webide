name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Validate
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundles
        run: npm run build

      - name: ESLint
        id: eslint
        run: npm run lint

      - name: HTMLHint
        id: htmlhint
        run: npm run lint:html

      - name: Validate JSON
        id: json
        run: npm run lint:json

      - name: Validate static assets
        id: static
        run: npm run lint:static

      - name: Check version consistency
        id: version
        run: npm run check-version

      - name: Unit tests
        id: test
        run: npm test

      - name: Lint summary
        if: always()
        run: |
          status() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }
          {
            echo "## CI Validation Results"
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| ESLint | $(status ${{ steps.eslint.outcome }}) |"
            echo "| HTMLHint | $(status ${{ steps.htmlhint.outcome }}) |"
            echo "| JSON validation | $(status ${{ steps.json.outcome }}) |"
            echo "| Static assets | $(status ${{ steps.static.outcome }}) |"
            echo "| Version | $(status ${{ steps.version.outcome }}) |"
            echo "| Unit tests | $(status ${{ steps.test.outcome }}) |"
          } >> "$GITHUB_STEP_SUMMARY"

  build-wasm:
    name: Build WASM
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Use Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve submodule SHAs
        run: |
          echo "MRUBY_SHA=$(git rev-parse HEAD:vendor/mruby)" >> "$GITHUB_ENV"
          echo "MRUBYC_SHA=$(git rev-parse HEAD:vendor/mrubyc)" >> "$GITHUB_ENV"

      # 'emsdk7.0.1' and 'ruby4' must match the toolchain versions configured below.
      - name: Restore WASM build cache
        id: wasm-build-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/
            vendor/mrubyc/src/_autogen_*.h
            vendor/mrubyc/src/mrblib.c
          key: wasm-build-${{ runner.os }}-emsdk7.0.1-ruby4-${{ env.MRUBY_SHA }}-${{ env.MRUBYC_SHA }}-${{ hashFiles('mruby_build_config.rb', 'Makefile') }}
      # Fresh checkouts give sources newer mtimes than the restored objects,
      # which would make rake/make recompile them all. Mark objects fresh
      # instead: the key already guarantees identical inputs.
      - name: Mark restored objects fresh
        if: steps.wasm-build-cache.outputs.cache-hit == 'true'
        run: |
          find build -exec touch {} + 2>/dev/null || true
          touch vendor/mrubyc/src/_autogen_*.h vendor/mrubyc/src/mrblib.c 2>/dev/null || true

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 7.0.1
          actions-cache-folder: .emsdk-cache

      - name: Verify Emscripten
        run: emcc --version

      - name: Setup Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: '4.0'

      - name: Build WebAssembly artifacts
        run: make all

      - name: Verify build artifacts
        run: |
          {
            echo "## Build Artifacts"
            echo "| File | Size |"
            echo "|------|------|"
            for f in public_html/mrbc/mrbc.js public_html/mrbc/mrbc.wasm public_html/mrubyc/mrubyc.js public_html/mrubyc/mrubyc.wasm; do
              size=$(stat -c%s "$f")
              echo "| \`$f\` | ${size} bytes |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          for f in public_html/mrbc/mrbc.js public_html/mrbc/mrbc.wasm public_html/mrubyc/mrubyc.js public_html/mrubyc/mrubyc.wasm; do
            size=$(stat -c%s "$f")
            if [ "$size" -lt 1000 ]; then
              echo "::error::$f is suspiciously small (${size} bytes)"
              exit 1
            fi
          done

      - name: Upload public_html artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openblink-webide-public-html
          path: public_html/
          retention-days: 30
