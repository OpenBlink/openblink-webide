name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Validate
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundles
        run: npm run build

      - name: ESLint
        id: eslint
        run: npm run lint

      - name: HTMLHint
        id: htmlhint
        run: npm run lint:html

      - name: Validate JSON
        id: json
        run: npm run lint:json

      - name: Validate static assets
        id: static
        run: npm run lint:static

      - name: Check version consistency
        id: version
        run: npm run check-version

      - name: Unit tests
        id: test
        run: npm test

      - name: Lint summary
        if: always()
        run: |
          status() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }
          {
            echo "## CI Validation Results"
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| ESLint | $(status ${{ steps.eslint.outcome }}) |"
            echo "| HTMLHint | $(status ${{ steps.htmlhint.outcome }}) |"
            echo "| JSON validation | $(status ${{ steps.json.outcome }}) |"
            echo "| Static assets | $(status ${{ steps.static.outcome }}) |"
            echo "| Version | $(status ${{ steps.version.outcome }}) |"
            echo "| Unit tests | $(status ${{ steps.test.outcome }}) |"
          } >> "$GITHUB_STEP_SUMMARY"

  build-wasm:
    name: Build WASM
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Use Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up and build WebAssembly
        uses: ./.github/actions/setup-wasm # zizmor: ignore[self-repository] load the action from the checked-out workspace

      - name: Verify build artifacts
        run: |
          {
            echo "## Build Artifacts"
            echo "| File | Size |"
            echo "|------|------|"
            for f in public_html/mrbc/mrbc.js public_html/mrbc/mrbc.wasm public_html/mrubyc/mrubyc.js public_html/mrubyc/mrubyc.wasm; do
              size=$(stat -c%s "$f")
              echo "| \`$f\` | ${size} bytes |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          for f in public_html/mrbc/mrbc.js public_html/mrbc/mrbc.wasm public_html/mrubyc/mrubyc.js public_html/mrubyc/mrubyc.wasm; do
            size=$(stat -c%s "$f")
            if [ "$size" -lt 1000 ]; then
              echo "::error::$f is suspiciously small (${size} bytes)"
              exit 1
            fi
          done

      - name: Upload public_html artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openblink-webide-public-html
          path: public_html/
          retention-days: 30
