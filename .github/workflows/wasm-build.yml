name: WASM Build

on:
  push:
    branches: [main]
    paths:
      - "Makefile"
      - "mruby_build_config.rb"
      - "src/**"
      - "vendor/mruby"
      - "vendor/mrubyc"
      - "vendor/emsdk"
      - ".gitmodules"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Use Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up and build WebAssembly
        uses: ./.github/actions/setup-wasm # zizmor: ignore[self-repository] load the action from the checked-out workspace

      - name: Verify output
        run: |
          ls -la public_html/mrbc/mrbc.js public_html/mrbc/mrbc.wasm
          ls -la public_html/mrubyc/mrubyc.js public_html/mrubyc/mrubyc.wasm

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openblink-webide-wasm
          path: |
            public_html/mrbc/mrbc.js
            public_html/mrbc/mrbc.wasm
            public_html/mrubyc/mrubyc.js
            public_html/mrubyc/mrubyc.wasm
          retention-days: 30
