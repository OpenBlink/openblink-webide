name: WASM Build

on:
  push:
    branches: [main]
    paths:
      - "Makefile"
      - "mruby_build_config.rb"
      - "src/**"
      - "vendor/mruby"
      - "vendor/mrubyc"
      - "vendor/emsdk"
      - ".gitmodules"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 7.0.1

      - name: Verify Emscripten
        run: emcc --version

      - name: Setup Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "3.4"

      - name: Build WebAssembly artifacts
        run: make all

      - name: Verify output
        run: |
          ls -la public_html/mrbc/mrbc.js public_html/mrbc/mrbc.wasm
          ls -la public_html/mrubyc/mrubyc.js public_html/mrubyc/mrubyc.wasm

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openblink-webide-wasm
          path: |
            public_html/mrbc/mrbc.js
            public_html/mrbc/mrbc.wasm
            public_html/mrubyc/mrubyc.js
            public_html/mrubyc/mrubyc.wasm
          retention-days: 30
