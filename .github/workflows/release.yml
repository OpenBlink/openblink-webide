name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 24
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: Build bundles
        run: npm run build

      - name: Check release version
        run: npm run check-version

      - name: ESLint
        run: npm run lint

      - name: HTMLHint
        run: npm run lint:html

      - name: Validate JSON
        run: npm run lint:json

      - name: Validate static assets
        run: npm run lint:static

      - name: npm audit
        run: npm audit --audit-level=high

  build:
    name: Build Release Artifact
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 24
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 7.0.1

      - name: Verify Emscripten
        run: emcc --version

      - name: Setup Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "3.4"

      - name: Build WebAssembly artifacts
        run: make all

      - name: Clean mrbc build artifacts
        run: make clean-mrbc

      - name: Verify build artifacts
        run: |
          for f in public_html/mrbc/mrbc.js public_html/mrbc/mrbc.wasm public_html/mrubyc/mrubyc.js public_html/mrubyc/mrubyc.wasm; do
            size=$(stat -c%s "$f")
            if [ "$size" -lt 1000 ]; then
              echo "::error::$f is suspiciously small (${size} bytes)"
              exit 1
            fi
            echo "✓ $f (${size} bytes)"
          done

      - name: Install 7-Zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Create release archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          7z a -tzip -mm=Deflate -mx=9 "openblink-webide-${VERSION}.zip" ./public_html/*

      - name: Verify release archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          archive="openblink-webide-${VERSION}.zip"
          7z t "$archive"
          methods=$(7z l -slt "$archive" | awk -F' = ' '/^Method = / { print $2 }' | sort -u)
          echo "$methods"
          if echo "$methods" | grep -Ev '^(|Store|Deflate)$'; then
            echo "::error::Archive contains a non-compatible ZIP compression method"
            exit 1
          fi

      - name: Generate checksums
        run: |
          sha256sum openblink-webide-*.zip > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            openblink-webide-*.zip
            checksums-sha256.txt

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: List release files
        run: ls -la openblink-webide-*.zip checksums-sha256.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            openblink-webide-*.zip
            checksums-sha256.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        # zizmor: ignore[superfluous-actions] keeps gh-release for generated notes + file upload UX
        with:
          generate_release_notes: true
          files: |
            openblink-webide-*.zip
            checksums-sha256.txt

      - name: Release summary
        if: always()
        env:
          RELEASE_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "## Release ${RELEASE_NAME}"
            echo ""
            echo "### SHA-256 Checksums"
            echo '```'
            cat checksums-sha256.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
